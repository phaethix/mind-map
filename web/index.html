<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0"
    />
    <!-- 开发时来自 public/，构建后由 copy.js 改写为带内容哈希的文件名，换图标时自动失效缓存 -->
    <link rel="icon" href="./logo.ico" />
    <title>Mind</title>
    <script>
      // 自定义静态资源的路径
      window.externalPublicPath = './dist/'
      // 接管应用。Mac 客户端里由 Tauri 注入；浏览器里保持关闭
      window.takeOverApp = false
      if (typeof window.__TAURI_INTERNALS__ !== 'undefined') {
        window.takeOverApp = true
      }
      window.__bootLog = function (message) {
        try {
          if (window.__TAURI_INTERNALS__) {
            window.__TAURI_INTERNALS__.invoke('boot_log', {
              message: String(message)
            })
          }
        } catch (error) {}
      }
      window.addEventListener('error', function (event) {
        window.__bootLog(
          'error ' +
            event.message +
            ' ' +
            (event.filename || '') +
            ':' +
            event.lineno
        )
      })
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason
        window.__bootLog(
          'rejection ' + (reason && reason.stack ? reason.stack : reason)
        )
      })
    </script>
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but Mind doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      const getDataFromBackend = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve({
              mindMapData: {
                root: {
                  data: {
                    text: '根节点'
                  },
                  children: []
                },
                theme: {
                  template: 'avocado',
                  config: {}
                },
                layout: 'logicalStructure',
                config: {},
                view: null
              },
              mindMapConfig: {},
              lang: 'zh',
              localConfig: null
            })
          }, 200)
        })
      }
      const setTakeOverAppMethods = data => {
        window.takeOverAppMethods = {}
        // 获取思维导图数据的函数
        window.takeOverAppMethods.getMindMapData = () => {
          return data.mindMapData
        }
        // 保存思维导图数据的函数
        window.takeOverAppMethods.saveMindMapData = data => {
          console.log(data)
        }
        // 获取思维导图配置，也就是实例化时会传入的选项
        window.takeOverAppMethods.getMindMapConfig = () => {
          return data.mindMapConfig
        }
        // 保存思维导图配置
        window.takeOverAppMethods.saveMindMapConfig = config => {
          console.log(config)
        }
        // 获取语言的函数
        window.takeOverAppMethods.getLanguage = () => {
          return data.lang
        }
        // 保存语言的函数
        window.takeOverAppMethods.saveLanguage = lang => {
          console.log(lang)
        }
        // 获取本地配置的函数
        window.takeOverAppMethods.getLocalConfig = () => {
          return data.localConfig
        }
        // 保存本地配置的函数
        window.takeOverAppMethods.saveLocalConfig = config => {
          console.log(config)
        }
      }
      const invokeDesktop = (command, args) => {
        return window.__TAURI_INTERNALS__.invoke(command, args || {})
      }
      const reportDesktopError = error => {
        const message = error && error.message ? error.message : String(error)
        window.alert(message)
      }
      const applyDesktopSession = session => {
        window.__desktopSession = session
        if (session.fileName) {
          document.title = session.fileName
        }
        window.takeOverAppMethods = {
          getMindMapData: () => window.__desktopSession.mindMapData,
          saveMindMapData: data => {
            window.__desktopSession.mindMapData = data
            invokeDesktop('save_mind_map', { data }).catch(reportDesktopError)
          },
          getMindMapConfig: () => window.__desktopSession.mindMapConfig || {},
          saveMindMapConfig: config => {
            window.__desktopSession.mindMapConfig = config
            invokeDesktop('save_config', { config }).catch(reportDesktopError)
          },
          getLanguage: () => window.__desktopSession.lang || 'zh',
          saveLanguage: lang => {
            window.__desktopSession.lang = lang
            invokeDesktop('save_lang', { lang }).catch(reportDesktopError)
          },
          getLocalConfig: () => window.__desktopSession.localConfig,
          saveLocalConfig: config => {
            window.__desktopSession.localConfig = config
            invokeDesktop('save_local_config', { config }).catch(
              reportDesktopError
            )
          }
        }
      }
      const showDesktopDocument = session => {
        applyDesktopSession(session)
        if (window.$bus) {
          window.$bus.$emit('enterEditor')
          window.$bus.$emit('setData', session.mindMapData)
        }
      }
      window.__desktopShow = showDesktopDocument
      window.__desktopOnMenu = async action => {
        try {
          if (action === 'check-update') {
            if (window.$bus) {
              window.$bus.$emit('checkUpdate')
            }
            return
          }
          if (action === 'rename') {
            if (window.$bus) {
              window.$bus.$emit('renameFile')
            }
            return
          }
          if (
            action === 'github-sign-in' ||
            action === 'github-push' ||
            action === 'github-pull'
          ) {
            if (window.$bus) {
              window.$bus.$emit('showGithubSync', action)
            }
            return
          }
          if (action === 'save') {
            await invokeDesktop('save_mind_map', {
              data: window.__desktopSession.mindMapData
            })
            return
          }
          if (action === 'reveal') {
            await invokeDesktop('reveal_documents')
            return
          }
          let next = null
          if (action === 'new') {
            next = await invokeDesktop('new_file')
          } else if (action === 'open') {
            next = await invokeDesktop('open_file')
          } else if (action === 'save-as') {
            next = await invokeDesktop('save_file_as', {
              data: window.__desktopSession.mindMapData
            })
          } else if (action === 'open-pending') {
            next = await invokeDesktop('take_pending_open')
          }
          if (next) {
            showDesktopDocument(next)
          }
        } catch (error) {
          reportDesktopError(error)
        }
      }
      window.__desktopBootstrap = async () => {
        const session = await invokeDesktop('bootstrap')
        applyDesktopSession(session)
        return session
      }
      window.onload = async () => {
        if (!window.takeOverApp) return
        let data = null
        if (typeof window.__TAURI_INTERNALS__ !== 'undefined') {
          try {
            data = await window.__desktopBootstrap()
          } catch (error) {
            reportDesktopError(error)
            return
          }
        } else {
          data = await getDataFromBackend()
          setTakeOverAppMethods(data)
        }
        // 思维导图实例创建完成事件
        window.$bus.$on('app_inited', () => {})
        // 实例化页面
        try {
          window.initApp()
          window.__bootLog('initApp done')
        } catch (error) {
          window.__bootLog(
            'initApp failed ' + (error && error.stack ? error.stack : error)
          )
        }
      }
    </script>
  </body>
</html>
