name: Checks

# PR 上跑格式、Rust 编译和前端构建；main 上额外把 web 产物发布到 GitHub Pages。
# 部署排在检查之后，避免坏提交先上线再报警。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 合并后 PR 标题会成为 main 上的提交标题，所以按 Conventional Commits 校验
  title:
    name: title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must not start with an uppercase letter.
            Write the title as `type: lowercase imperative summary`.

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 这一步只用到 prettier：装上 Bun 就能跑，不必再装 Node 和 npm 缓存
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install tooling
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun x prettier --check .

      # Dependabot 只改 package-lock.json，bun.lock 会悄悄落后于它。
      # 这里把 package-lock.json 重新迁移一遍，与提交的 bun.lock 比对：不一致就失败，
      # 免得本地 bun install 装到旧版本、CI 装到新版本。
      - name: Check lockfiles are in sync
        run: |
          for dir in . web desktop; do
            tmp=$(mktemp -d)
            cp "$dir/package.json" "$dir/package-lock.json" "$tmp/"
            (cd "$tmp" && bun install --lockfile-only >/dev/null)
            if ! diff -u "$dir/bun.lock" "$tmp/bun.lock"; then
              echo "::error file=$dir/bun.lock::$dir/bun.lock 与 package-lock.json 不同步：先跑 npm install --package-lock-only，再跑 bun install --lockfile-only，两份锁文件一起提交"
              exit 1
            fi
            rm -rf "$tmp"
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

  cargo:
    name: cargo
    runs-on: ubuntu-latest
    # 首次运行要装 apt 包并全量编译，给足时间；命中缓存后约 1 分钟
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 命中缓存时不再跑 apt-get update，避免 Ubuntu 源变慢把整步拖到超时
      - name: Install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@b8f4936ae6bd604d21de6c1243d45b013396d81b # v1
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: 1.0

      # 缓存 ~/.cargo 和 target：依赖只编译一次，之后的运行直接命中
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: desktop/src-tauri
          shared-key: cargo-check

      # generate_context! 要求 frontendDist 存在；PR 上不构建前端，给个空目录就够了
      - name: Prepare frontend placeholder
        run: mkdir -p desktop-dist

      - name: Check Rust
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 构建仍跑在 Node 上：vite 和 copy.js 走的是 node shebang，只有装依赖换成 Bun
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # Bun 的全局缓存按锁文件哈希保存，命中后装 380MB 依赖只要几百毫秒；
      # 取代原先 setup-node 的 cache: npm。Bun 升级不失效缓存，锁文件变才失效。
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # 这三个是无框架的断言脚本，之前只在本地手动跑，CI 从来没执行过。
      # 放在构建之前：逻辑错误比打包错误更值得先失败。
      - name: Test
        run: |
          bun web/src/utils/fileLibrary.test.cjs
          bun web/src/utils/mermaidMindmap.test.cjs
          bun simple-mind-map/test/xmind-associative-line.test.cjs

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Assemble site
        if: github.event_name == 'push'
        run: |
          mkdir -p site/dist
          cp index.html site/index.html
          cp -R dist/. site/dist/
          touch site/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name == 'push'
    needs: [format, cargo, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
