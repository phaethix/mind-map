name: Release desktop app

# 推送 v* tag 时自动构建并发布；也可以在 Actions 页面手动填 tag 重跑。
#
# Windows / Linux 发布安装包，macOS 只发布更新包（.app.tar.gz）：首次安装仍走
# 仓库里的 `make`，本地编译后装进 ~/Applications，绕开 Gatekeeper 和公证；
# 之后的新版本由应用内 updater 直接替换，不经过浏览器的下载隔离标记。
#
# 自动更新依赖签名：仓库 secrets 里要有 TAURI_SIGNING_PRIVATE_KEY
# （以及可选的 TAURI_SIGNING_PRIVATE_KEY_PASSWORD）。没有密钥时构建出的包
# 无法通过 updater 校验，latest.json 会在 publish 环节报错中断。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.2.0）'
        required: true
      prerelease:
        description: '标记为预发布：不会成为 latest，自动更新也不会选中（用于演练）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # 构建和发布两处都要算 tag，统一放在这里，避免表达式各写一遍
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            artifact: windows
            # 平台键带 installer 后缀，deb 用户才不会误用 AppImage 的更新包
            platform: windows-x86_64-nsis
          # 用 22.04 而不是 latest：glibc 基线压到 2.35，新发行版向下兼容；
          # 也是第一个带 webkit2gtk-4.1 的 LTS，Tauri v2 需要它
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux
            platform: linux-x86_64-appimage
          # 固定 macos-14：它一定是 Apple Silicon，不会随 latest 迁移换架构
          - name: macos
            os: macos-14
            bundles: app
            artifact: macos
            platform: darwin-aarch64-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 手动触发时默认只取分支，这里显式取 tag，保证打出来的包版本号对得上
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # 格式不对就别打包了，早失败比发布一个风格不一致的构建便宜
      - name: Check rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # vue-cli 4 的传递依赖会刷几十条 deprecated / EBADENGINE 警告，
      # 这些只能靠迁移整条构建链消除，安装时只保留错误输出
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund --loglevel=error

      # 放在 npm ci 之后：它会改 web/package.json 的 version，避免和 lockfile 的校验撞上。
      # 用 GitHub 表达式而不是 ${VAR}：Windows runner 默认是 pwsh，读不到 bash 风格的变量
      - name: Sync version into manifests
        run: node scripts/sync-version.mjs "${{ env.RELEASE_TAG }}"

      # tauri build 会先跑 beforeBuildCommand（desktop/prepare-dist.mjs），
      # 把 web 产物打包进 desktop-dist 再编译；--bundles 覆盖 tauri.conf 里的 targets，
      # 因为配置里的 "app" 是 macOS 专用的产物类型。
      # createUpdaterArtifacts 只在 CI 打开：本地 make 构建没有私钥，打开会直接失败
      - name: Build bundles
        working-directory: desktop
        shell: bash
        env:
          CI: true
          # Runner 里没有 FUSE 时，linuxdeploy / appimagetool 需要自解压才能跑
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          # updater 直接用安装包本体：Windows 的 -setup.exe、Linux 的 .AppImage，
          # macOS 则是 .app.tar.gz；签名以同名 .sig 一起发
          find desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) \
            -exec cp {} out/ \;
          # deb 不支持自更新，它的签名永远不会被读取，不随 Release 发布
          find desktop/src-tauri/target/release/bundle -type f -name '*.sig' ! -name '*.deb.sig' -exec cp {} out/ \;
          ls -lh out
          test -n "$(ls -A out)"

      # 每个平台产出自己那份更新信息，publish 环节合并成 latest.json
      - name: Write update fragment
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const dir = "out";
          const files = fs.readdirSync(dir);
          const platform = process.env.PLATFORM;
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GITHUB_REPOSITORY;
          // 平台键形如 linux-x86_64-appimage，最后一段是安装器类型；
          // 后缀按 tauri-bundler 的实际产物命名：NSIS 和 AppImage 直接签名安装包本体
          const suffix = {
            nsis: "-setup.exe",
            appimage: ".AppImage",
            app: ".app.tar.gz"
          }[platform.split("-").pop()];
          if (!suffix) throw new Error("unsupported platform: " + platform);
          const file = files.find(
            name => name.endsWith(suffix) && !name.endsWith(".sig")
          );
          const sig = file && files.find(name => name === file + ".sig");
          if (!file || !sig) throw new Error("missing updater artifact for " + platform + ": " + files.join(", "));
          const fragment = {};
          fragment[platform] = {
            signature: fs.readFileSync(path.join(dir, sig), "utf8").trim(),
            url: "https://github.com/" + repo + "/releases/download/" + tag + "/" + file
          };
          fs.writeFileSync(path.join(dir, "update-" + platform + ".json"), JSON.stringify(fragment, null, 2));
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 需要完整历史才能 diff 出上一个 tag 到本次的提交
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      # 发布说明按「上一个 tag..本 tag」的提交自动生成，不用每次手写
      - name: Compose release notes
        run: |
          tag="${{ env.RELEASE_TAG }}"
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            echo "A lightweight, minimal, and customizable mind map."
            echo
            if [ -n "$prev" ]; then
              echo "### Changes since $prev"
              echo
              # 只列用户能感知的改动，chore/docs/build 这类内部提交不进发布说明
              git log --no-merges --pretty='- %s' "$prev..$tag" | grep -E '^- (feat|fix|perf):' || echo "- Maintenance release."
              echo
              echo "Full changelog: https://github.com/${{ github.repository }}/compare/$prev...$tag"
            else
              echo "First release."
            fi
            echo
            echo "Install instructions are in the [README](https://github.com/${{ github.repository }}#install)."
          } > notes.md
          cat notes.md

      # updater 的清单：版本、更新说明、各平台的下载地址和签名
      - name: Compose updater manifest
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const dir = "dist";
          const platforms = {};
          for (const name of fs.readdirSync(dir)) {
            if (!name.startsWith("update-") || !name.endsWith(".json")) continue;
            Object.assign(platforms, JSON.parse(fs.readFileSync(path.join(dir, name), "utf8")));
            fs.unlinkSync(path.join(dir, name));
          }
          if (Object.keys(platforms).length === 0) throw new Error("no updater fragments found");
          const tag = process.env.RELEASE_TAG;
          // 更新弹窗只展示要点，不要整篇发布说明
          const bullets = fs
            .readFileSync("notes.md", "utf8")
            .split("\n")
            .filter(line => line.startsWith("- "))
            .join("\n");
          const manifest = {
            version: tag.replace(/^v/, ""),
            notes: bullets || "Maintenance release.",
            pub_date: new Date().toISOString(),
            platforms
          };
          fs.writeFileSync(path.join(dir, "latest.json"), JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          '

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mind ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: notes.md
          # 演练时用预发布：不会成为 latest，updater 也不会选中
          prerelease: ${{ inputs.prerelease || false }}
